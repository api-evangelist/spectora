name: Spectora
kind: company
description: >-
  Spectora is home inspection software used by more than 10,000 inspectors to
  build inspection reports, schedule jobs, manage clients and agents, run a
  website, take payments, and automate follow-up. Spectora does NOT publish a
  public, self-serve developer REST API and there is no developer portal, API
  reference, or API keys for third-party programmatic access as of this writing.
  Integration with outside systems is instead delivered three ways: (1) a Zapier
  integration (requires the paid Spectora Advanced add-on) that fires triggers
  when agent or client contacts are created or updated; (2) outbound webhooks
  configured through Advanced Actions that POST event data to a URL you supply
  (e.g. Zapier, Make, or your own endpoint); and (3) a fixed set of named,
  vendor-built partner integrations (QuickBooks Online, Google Calendar, Google
  Drive, Mailchimp, HomeBinder, RecallChek, Repair Pricer, Blipp Reviews,
  InterNACHI BuyBack, and call-center partners). All of these are
  configuration-time connectors and one-way (outbound) event flows rather than a
  documented request/response API you can call.
