created: '2026-07-04'
modified: '2026-07-04'
reconciled: false
tags:
- Home Inspection
- Field Services
- Per Inspector
- Plans
description: >-
  Spectora is sold as a per-inspector SaaS subscription, not as a metered API.
  The base plan is roughly $109/month (about $1,099/year on annual billing) for
  the first inspector and includes report templates, the mobile app, a website,
  scheduling, payments, and support with no per-inspection charge and no
  contract. Each additional inspector is roughly $89/month (about $828/year).
  The optional Spectora Advanced add-on is billed per published inspection
  (about $3-4 per published report) and unlocks automation, CRM tooling,
  business insights, and - importantly for integration - the Zapier connection.
  There is no separate API pricing because there is no public developer API;
  the only programmatic-adjacent capability (Zapier/webhooks) is gated behind
  the Advanced add-on. Verify current rates on Spectora's pricing page during
  reconciliation.
notes: >-
  Prices are approximate and change over time; figures reflect publicly cited
  2026 pricing. There is no API plan, no rate card for programmatic calls, and
  no self-serve API keys - integration is limited to Advanced-gated Zapier and
  outbound webhooks.
sources:
- https://www.spectora.com/pricing/
- https://support.spectora.com/en/articles/9236552-what-s-included-in-spectora-s-software
- https://support.spectora.com/en/articles/5949874-using-the-zapier-integration
plans:
